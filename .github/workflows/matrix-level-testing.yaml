name: Matrix Testing on Diff Env
on: 
  workflow_dispatch: 
  push: 
    branches:
      - main
      - 'feature/*'
env: 
  MONGODB_URI: 'mongodb+srv://shanmukhamchowdary:pqP522VYEzZWFHGq@cluster0.orrajh6.mongodb.net/'
  MONGODB_USERNAME: ${{ vars.MONGODB_USERNAME }}
  MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}

jobs: 
  unit-testing:
    name: Unit Testing
    services: 
      mongo-db:
        image: shannu1434/mongo-db:non-prod
        ports:
          - 27017:27017

    env: 
      MONGODB_URI: 'mongodb://localhost:27017/superData'
      MONGODB_USERNAME: non-prod-user
      MONGODB_PASSWORD: non-prod-password

    runs-on: ubuntu-latest
    steps: 
    - name: checkout Repository
      uses: actions/checkout@v4

    - name: Setup Nodejs version - 18
      uses: actions/setup-node@v4
      with: 
        node-version: 18
    
    - name: cache npm dependency
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashfiles('package-lock.json') }}

    - name: Install Dependencies
      run: npm install

    - name: Unit Testing
      id: nodejs-unit-testing-step
      run: npm test

    - name: Archieve test Result
      if: always()
      uses: actions/upload-artifact@v4
      with: 
        name: Mocha-Test-Result
        path: test-results.xml

  code-coverage: 
    name: Code Coverage
    container: 
      image: node:18
    services: 
      mongo-db:
        image: shannu1434/mongo-db:non-prod
        options: 
          --name mongo

    env: 
      MONGODB_URI: 'mongodb://mongo:27017/superData'
      MONGODB_USERNAME: non-prod-user
      MONGODB_PASSWORD: non-prod-password

    runs-on: ubuntu-latest
    steps: 
    - name: Checkout Repo
      uses: actions/checkout@v4
    
    # - name: Setup Nodejs version - 18
    #   uses: actions/setup-node@v4
    #   with: 
    #     node-version: 18
    - name: cache npm dependency
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashfiles('package-lock.json') }}
        

    - name: Install dependencies
      run: npm install

    - name: check code coverage
      continue-on-error: true
      run: npm run coverage

    - name: Archieve test result
      uses: actions/upload-artifact@v4
      with: 
        name: code-coverage-Result
        path: coverage
        retention-days: 5

  docker: 
    name: Containerizatiion
    needs: [unit-testing , code-coverage]
    permissions: 
      packages: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 
      uses: actions/checkout@v4

    - name: DockerHubLogin
      uses: docker/login-action@v3.4.0
      with: 
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}


    - name: GHCR LOGIN
      uses: docker/login-action@v3.4.0
      with: 
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}


    - name: Docker Build for Testing
      uses: docker/build-push-action@v6.18.0
      with: 
        context: .
        push: false
        tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

    - name: Docker Image testing
      run: |
        docker images
        docker run --name solar-system-app -d \
           -p 3000:3000 \
           -e MONGO_URI=$MONGO_URI \
           -e MONGODB_USERNAME=$MONGODB_USERNAME \
           -e MONGODB_PASSWORD=$MONGODB_PASSWORD \
           ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

        export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
        echo $IP

        echo Testing Image URL using wget
        wget -q -O - http://localhost:3000/live | grep live

    - name: Container Registry Push
      uses: docker/build-push-action@v6.18.0
      with: 
        context: .
        push: true
        tags: |
          ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

  dev-deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 
      uses: actions/checkout@v4

    - name: Create KinD cluster
      uses: helm/kind-action@v1

    - name: Install kubectl 
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.26.0'

    - name: Fetch k8s cluster Details
      run: |
        kubectl version --short
        echo -----------------------------
        kubectl get nodes

    - name: Show current kubectl context
      run: kubectl config current-context
    
    - name: Replace tokens in manifest files
      uses: cschleiden/replace-tokens@v1
      with:
        tokenPrefix: '_{_'
        tokenSuffix: '_}_'
        files: '["kubernetes/development/deployment.yaml"]'

    - name: runcmds
      run: kubectl get deployment